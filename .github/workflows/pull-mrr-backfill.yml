name: MRR historical backfill (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backfill-mrr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run MRR backfill
        env:
          CW_BASE_URL: ${{ secrets.CW_BASE_URL }}
          CW_COMPANY_ID: ${{ secrets.CW_COMPANY_ID }}
          CW_PUBLIC_KEY: ${{ secrets.CW_PUBLIC_KEY }}
          CW_PRIVATE_KEY: ${{ secrets.CW_PRIVATE_KEY }}
          CW_CLIENT_ID: ${{ secrets.CW_CLIENT_ID }}
          MRR_LICENSING_KEYWORDS: ${{ secrets.MRR_LICENSING_KEYWORDS }}
        run: node cw-mrr-backfill.js

      - name: Commit backfilled data
        run: |
          git config user.name "mrr-backfill-bot"
          git config user.email "actions@github.com"
          git add data/mrr/
          git diff --quiet --cached || git commit -m "MRR historical backfill (Jan 2025 -> present)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
