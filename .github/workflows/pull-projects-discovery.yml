name: Projects discovery (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discover-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Projects discovery
        env:
          CW_BASE_URL: ${{ secrets.CW_BASE_URL }}
          CW_COMPANY_ID: ${{ secrets.CW_COMPANY_ID }}
          CW_PUBLIC_KEY: ${{ secrets.CW_PUBLIC_KEY }}
          CW_PRIVATE_KEY: ${{ secrets.CW_PRIVATE_KEY }}
          CW_CLIENT_ID: ${{ secrets.CW_CLIENT_ID }}
        run: node cw-projects-discovery.js

      - name: Commit debug data
        run: |
          git config user.name "discovery-bot"
          git config user.email "actions@github.com"
          git add data/projects/_debug-discovery.json
          git diff --quiet --cached || git commit -m "Projects discovery pull"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
