<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0B1120; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 900px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } }
  .chart-row { display: grid; grid-template-columns: 1.7fr 1fr; gap: 14px; align-items: stretch; }
  @media (max-width: 900px) { .chart-row { grid-template-columns: 1fr; } }
  .side-metrics { display: flex; flex-direction: column; gap: 14px; }
  .row-hover:hover { background: #16203570 !important; }
  .nav-btn { cursor: pointer; user-select: none; }
  .nav-btn:hover { opacity: 0.7; }
  .nav-btn[disabled] { opacity: 0.25; cursor: default; }
  .toggle-btn { cursor: pointer; }
  .tab-bar { display: flex; gap: 4px; padding: 10px 24px; border-bottom: 1px solid #3A3A3C; background: #1B1B1C; }
  .masthead { display: flex; align-items: center; gap: 12px; padding: 14px 24px; background: #1B1B1C; border-bottom: 1px solid #3A3A3C; }
  .masthead-logo-chip { background: #FFFFFF; border-radius: 6px; padding: 5px 10px; display: flex; align-items: center; }
  .tab-btn { cursor: pointer; }
  .tab-btn[disabled] { cursor: default; opacity: 0.35; }
</style>

</script>

  function fmtCurrency(n) {
    return "$" + Math.abs(Math.round(n || 0)).toLocaleString("en-US");
  }

  // "2026-08-03" -> "8/3"
  function fmtMD(isoDateStr) {
    const [, m, d] = isoDateStr.split("-");
    return `${Number(m)}/${Number(d)}`;
  }

  function isWeekdayISO(isoDateStr) {
    const day = new Date(isoDateStr + "T00:00:00Z").getUTCDay();
    return day !== 0 && day !== 6;
  }

  const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  function fmtMonthLabel(key) {
    const [y, m] = key.split("-").map(Number);
    return `${MONTH_NAMES[m - 1]} ${y}`;
  }

  // All weekday (Mon-Fri) ISO dates within a month, given its key "YYYY-MM"
  function weekdaysInMonthList(monthKey) {
    const [y, m] = monthKey.split("-").map(Number);
    const start = new Date(Date.UTC(y, m - 1, 1));
    const end = new Date(Date.UTC(y, m, 0));
    const out = [];
    const cursor = new Date(start);
    while (cursor <= end) {
      if (!isWeekdayISO(cursor.toISOString().split("T")[0])) {
        // skip weekends
      } else {
        out.push(cursor.toISOString().split("T")[0]);
      }
      cursor.setUTCDate(cursor.getUTCDate() + 1);
    }
    return out;
  }

  // Chunk weekdays into groups of 5 (Mon-Fri "weeks")
  function chunkIntoWeeks(weekdayList) {
    const weeks = [];
    for (let i = 0; i < weekdayList.length; i += 5) {
      weeks.push(weekdayList.slice(i, i + 5));
    }
    return weeks;
  }

  function SectionLabel({ children, accent }) {
    return h("div", { style: { display: "flex", alignItems: "center", gap: 10, marginBottom: 14 } },
      h("div", { style: { width: 6, height: 6, borderRadius: 2, background: accent } }),
      h("span", { style: { fontFamily: FONT_MONO, fontSize: 11, letterSpacing: "0.14em", color: colors.muted, textTransform: "uppercase" } }, children)
    );
  }

  function Panel({ children, style }) {
    return h("div", { style: { background: colors.panel, border: `1px solid ${colors.hairline}`, borderRadius: 10, padding: 18, ...style } }, children);
  }

  function StatTile({ label, value, sub, accent, glyph, trendUp }) {
    return h(Panel, { style: { display: "flex", flexDirection: "column", gap: 10, minHeight: 108 } },
      h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "flex-start" } },
        h("span", { style: { fontFamily: FONT_BODY, fontSize: 12.5, color: colors.muted } }, label),
        h("span", { style: { fontSize: 15, color: accent } }, glyph)
      ),
      h("div", { style: { fontFamily: FONT_MONO, fontSize: 26, color: colors.hi, fontWeight: 600, lineHeight: 1 } }, value),
      sub && h("div", { style: { fontSize: 12, color: colors.muted, fontFamily: FONT_BODY } },
        (trendUp === true ? "▲ " : trendUp === false ? "▼ " : "") + sub
      )
    );
  }

  function NavArrow({ direction, disabled, onClick }) {
    return h("button", {
      className: "nav-btn",
      disabled,
      onClick,
      style: {
        background: "transparent", border: `1px solid ${colors.hairline}`, borderRadius: 6,
        color: colors.hi, width: 28, height: 28, fontFamily: FONT_MONO, fontSize: 14,
      }
    }, direction === "prev" ? "‹" : "›");
  }

  function AccrualChart({ data, selectedDate, onDayClick }) {
    const [hoverIdx, setHoverIdx] = useState(null);
    const W = 900, H = 260, padL = 46, padR = 14, padT = 12, padB = 26;
    const innerW = W - padL - padR;
    const innerH = H - padT - padB;

    const maxVal = Math.max(1, ...data.map(d => Math.max(d.cumulative, d.goalPace)));
    const step = data.length > 1 ? innerW / (data.length - 1) : innerW;
    const barWidth = Math.min(28, (innerW / Math.max(data.length, 1)) * 0.5);

    const xAt = (i) => padL + i * step;
    const yAt = (v) => padT + innerH - (v / maxVal) * innerH;

    const cumulativePath = data.map((d, i) => `${i === 0 ? "M" : "L"} ${xAt(i)} ${yAt(d.cumulative)}`).join(" ");
    const goalPath = data.map((d, i) => `${i === 0 ? "M" : "L"} ${xAt(i)} ${yAt(d.goalPace)}`).join(" ");

    const gridLines = 4;
    const gridVals = Array.from({ length: gridLines + 1 }, (_, i) => (maxVal / gridLines) * i);

    const hovered = hoverIdx !== null ? data[hoverIdx] : null;

    // Tooltip box, positioned near the hovered point but clamped so it
    // never runs off either edge of the chart.
    let tooltip = null;
    if (hovered) {
      const boxW = 132, boxH = 68, gap = 10;
      const px = xAt(hoverIdx);
      const py = yAt(hovered.cumulative);
      let bx = px + gap;
      if (bx + boxW > W - padR) bx = px - gap - boxW;
      let by = py - boxH - gap;
      if (by < padT) by = py + gap;

      tooltip = h("g", { style: { pointerEvents: "none" } },
        h("rect", { x: bx, y: by, width: boxW, height: boxH, rx: 6, fill: colors.panel, stroke: colors.hairline, strokeWidth: "1" }),
        h("text", { x: bx + 10, y: by + 18, fontFamily: FONT_MONO, fontSize: "11", fontWeight: "600", fill: colors.hi }, fmtMD(hovered.date)),
        h("text", { x: bx + 10, y: by + 33, fontFamily: FONT_MONO, fontSize: "10", fill: colors.bar }, `Daily: ${fmtCurrency(hovered.accrued)}`),
        h("text", { x: bx + 10, y: by + 47, fontFamily: FONT_MONO, fontSize: "10", fill: colors.finance }, `Cumulative: ${fmtCurrency(hovered.cumulative)}`),
        h("text", { x: bx + 10, y: by + 61, fontFamily: FONT_MONO, fontSize: "10", fill: colors.goalLine }, `Goal pace: ${fmtCurrency(hovered.goalPace)}`)
      );
    }

    return h("svg", { viewBox: `0 0 ${W} ${H}`, style: { width: "100%", height: "auto", display: "block" } },
      gridVals.map((v, i) => h("g", { key: "grid" + i },
        h("line", { x1: padL, x2: W - padR, y1: yAt(v), y2: yAt(v), stroke: colors.hairline, strokeWidth: "1" }),
        h("text", { x: padL - 8, y: yAt(v) + 4, textAnchor: "end", fontFamily: FONT_MONO, fontSize: "10", fill: colors.faint }, Math.round(v / 1000) + "k")
      )),

      // Selected-day highlight column, drawn behind the bars
      selectedDate && data.some((d) => d.date === selectedDate) && (() => {
        const i = data.findIndex((d) => d.date === selectedDate);
        return h("rect", { x: xAt(i) - step / 2, y: padT, width: step, height: innerH, fill: colors.hi, opacity: "0.05" });
      })(),

      data.map((d, i) => h("rect", {
        key: "bar" + i,
        x: xAt(i) - barWidth / 2,
        y: yAt(d.accrued),
        width: barWidth,
        height: Math.max(0, yAt(0) - yAt(d.accrued)),
        fill: colors.bar,
        opacity: "0.55",
        rx: "2",
      })),
      h("path", { d: goalPath, fill: "none", stroke: colors.goalLine, strokeWidth: "1.5", strokeDasharray: "4 4" }),
      h("path", { d: cumulativePath, fill: "none", stroke: colors.finance, strokeWidth: "2.5" }),
      data.map((d, i) => h("circle", {
        key: "dot" + i, cx: xAt(i), cy: yAt(d.cumulative),
        r: d.date === selectedDate ? "5" : "3.5",
        fill: colors.finance,
        stroke: d.date === selectedDate ? colors.hi : "none",
        strokeWidth: d.date === selectedDate ? "1.5" : "0",
      })),
      data.map((d, i) => h("text", { key: "lbl" + i, x: xAt(i), y: H - 6, textAnchor: "middle", fontFamily: FONT_MONO, fontSize: "10", fill: d.date === selectedDate ? colors.hi : colors.faint }, fmtMD(d.date))),

      // Invisible wide hit-targets — one per day, covering the full column
      // width so hover/click don't require pixel-perfect aim on a thin bar
      data.map((d, i) => h("rect", {
        key: "hit" + i,
        x: xAt(i) - step / 2,
        y: padT,
        width: step,
        height: innerH,
        fill: "transparent",
        style: { cursor: "pointer" },
        onMouseEnter: () => setHoverIdx(i),
        onMouseLeave: () => setHoverIdx((prev) => (prev === i ? null : prev)),
        onClick: () => onDayClick && onDayClick(d.date),
      })),

      tooltip
    );
  }

  function WipTab() {
    const [manifest, setManifest] = useState(null);
    const [selectedMonth, setSelectedMonth] = useState(null);
    const [monthData, setMonthData] = useState(null);
    const [lastFetched, setLastFetched] = useState(null);
    const [fetchError, setFetchError] = useState(null);
    const [viewMode, setViewMode] = useState("month"); // "month" | "week"
    const [weekIndex, setWeekIndex] = useState(null);
    const [updateState, setUpdateState] = useState("idle"); // "idle" | "triggering" | "waiting" | "error"
    const [updateMessage, setUpdateMessage] = useState("");
    const [expandedClient, setExpandedClient] = useState(null);
    const [selectedDay, setSelectedDay] = useState(null);

    async function loadManifest() {
      try {
        const res = await fetch(`${MANIFEST_URL}?t=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        setManifest(json);
        setSelectedMonth((prev) => prev ?? json.latest);
      } catch (e) {
        setFetchError(`manifest: ${e.message}`);
      }
    }

    async function loadMonth(key) {
      try {
        const res = await fetch(`${monthDataUrl(key)}?t=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        setMonthData(json);
        setLastFetched(new Date());
        setFetchError(null);
        return json;
      } catch (e) {
        setFetchError(`${key}: ${e.message}`);
        return null;
      }
    }

    async function handleUpdateClick() {
      setUpdateState("triggering");
      setUpdateMessage("Triggering WIP + MRR pulls…");
      try {
        const res = await fetch(TRIGGER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Trigger-Key": TRIGGER_KEY.trim() },
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok || !body.ok) {
          const detail = body.error || (body.results ? body.results.filter((r) => !r.ok).map((r) => `${r.workflowFile}: ${r.status}`).join(", ") : null);
          throw new Error(detail || `HTTP ${res.status}`);
        }

        setUpdateState("waiting");
        setUpdateMessage("Pulls running — checking for fresh WIP data…");

        const generatedAtBefore = monthData ? monthData.generatedAt : null;
        let tries = 0;
        const poll = setInterval(async () => {
          tries += 1;
          const fresh = await loadMonth(selectedMonth);
          const gotNewData = fresh && fresh.generatedAt !== generatedAtBefore;
          if (gotNewData || tries >= FAST_POLL_MAX_TRIES) {
            clearInterval(poll);
            if (gotNewData) {
              setUpdateState("idle");
              setUpdateMessage("");
              loadManifest(); // in case a new month appeared
            } else {
              setUpdateState("error");
              setUpdateMessage("Still processing — check the Actions tab if this takes more than a few minutes.");
            }
          }
        }, FAST_POLL_MS);
      } catch (e) {
        setUpdateState("error");
        setUpdateMessage(`Couldn't trigger update: ${e.message}`);
      }
    }

    useEffect(() => {
      loadManifest();
      const reloadTimer = setInterval(() => window.location.reload(), RELOAD_INTERVAL_MS);
      return () => clearInterval(reloadTimer);
    }, []);

    useEffect(() => {
      if (!selectedMonth) return;
      loadMonth(selectedMonth);
      const dataTimer = setInterval(() => loadMonth(selectedMonth), REFRESH_INTERVAL_MS);
      return () => clearInterval(dataTimer);
    }, [selectedMonth]);

    // Reset to "month" view and current-ish week whenever the month changes
    useEffect(() => {
      setViewMode("month");
      setWeekIndex(null);
      setExpandedClient(null);
      setSelectedDay(null);
    }, [selectedMonth]);

    const weeks = useMemo(() => {
      if (!monthData) return [];
      return chunkIntoWeeks(weekdaysInMonthList(monthData.month));
    }, [monthData]);

    // Default week index: the chunk containing currentDate (current month) or the last chunk (closed months)
    const effectiveWeekIndex = useMemo(() => {
      if (weekIndex !== null) return weekIndex;
      if (!monthData || weeks.length === 0) return 0;
      const idx = weeks.findIndex((wk) => wk.includes(monthData.currentDate));
      return idx >= 0 ? idx : weeks.length - 1;
    }, [weekIndex, weeks, monthData]);

    // Builds a chart series for an arbitrary set of weekday dates, filling
    // in zero-accrual days so bars still appear, with cumulative/goalPace
    // computed fresh from the start of that range.
    const chartData = useMemo(() => {
      if (!monthData) return [];
      const dailyGoalPace = monthData.monthGoal / monthData.weekdaysInMonth;
      const accrualByDate = new Map(monthData.dailyAccrual.map((d) => [d.date, d.accrued]));

      const dates = viewMode === "week" ? (weeks[effectiveWeekIndex] || []) : weekdaysInMonthList(monthData.month);

      let running = 0;
      let weekdayCount = 0;
      // For week view, cumulative should still reflect the month-to-date
      // total carried in from before the visible window, not reset to 0 —
      // otherwise a mid-month week looks like accrual started at zero.
      if (viewMode === "week" && dates.length > 0) {
        const firstVisible = dates[0];
        for (const d of monthData.dailyAccrual) {
          if (d.date < firstVisible) running += d.accrued;
        }
        const priorWeekdays = weekdaysInMonthList(monthData.month).filter((d) => d < firstVisible);
        weekdayCount = priorWeekdays.length;
      }

      return dates.map((date) => {
        const accrued = accrualByDate.get(date) || 0;
        running += accrued;
        if (isWeekdayISO(date)) weekdayCount += 1;
        return { date, accrued, cumulative: running, goalPace: Math.round(dailyGoalPace * weekdayCount) };
      });
    }, [monthData, viewMode, effectiveWeekIndex, weeks]);

    // Per-client breakdown for whichever day is clicked on the chart —
    // derived from the same per-client daily arrays the client-expand
    // table already uses, just filtered/regrouped by date instead of
    // by client. No extra data fetch needed.
    const dayBreakdown = useMemo(() => {
      if (!selectedDay || !monthData) return [];
      const rows = [];
      for (const c of monthData.clientBreakdown) {
        const match = (c.daily || []).find((d) => d.date === selectedDay);
        if (match && (match.hours > 0 || match.billed > 0)) {
          rows.push({ client: c.client, hours: match.hours, billed: match.billed });
        }
      }
      return rows.sort((a, b) => b.billed - a.billed);
    }, [selectedDay, monthData]);

    if (!manifest || !monthData) {
      return h("div", { style: { background: colors.bg, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: colors.muted, fontFamily: FONT_MONO } },
        fetchError ? `Error loading data: ${fetchError}` : "Loading WIP data…"
      );
    }

    const mtdTotal = monthData.dailyAccrual.reduce((s, d) => s + d.accrued, 0);
    const dailyGoalPace = monthData.monthGoal / monthData.weekdaysInMonth;
    const expectedByToday = dailyGoalPace * monthData.weekdaysElapsed;
    const paceDelta = mtdTotal - expectedByToday;
    const onPace = paceDelta >= 0;
    const projectedTotal = monthData.weekdaysElapsed > 0 ? (mtdTotal / monthData.weekdaysElapsed) * monthData.weekdaysInMonth : 0;

    const totalBilledHours = monthData.totalBilledHours || 0;
    const avgHourlyRate = totalBilledHours > 0 ? mtdTotal / totalBilledHours : 0;
    const todayEntry = monthData.dailyAccrual.find((d) => d.date === monthData.currentDate);
    const todayAccrued = todayEntry ? todayEntry.accrued : 0;
    // Same formula as the "$X/day needed" sub-label on the Weekdays
    // Remaining tile above — dynamic remaining-goal pace, not a flat
    // monthGoal/weekdaysInMonth split.
    const todayGoal = monthData.weekdaysRemaining > 0 ? (monthData.monthGoal - mtdTotal) / monthData.weekdaysRemaining : 0;
    const todayDelta = todayAccrued - todayGoal;
    const weekdaysAheadBehind = dailyGoalPace > 0 ? paceDelta / dailyGoalPace : 0;

    const monthIdx = manifest.months.indexOf(selectedMonth);
    const canPrevMonth = monthIdx > 0;
    const canNextMonth = monthIdx >= 0 && monthIdx < manifest.months.length - 1;

    const canPrevWeek = effectiveWeekIndex > 0;
    const canNextWeek = effectiveWeekIndex < weeks.length - 1;

    return h("div", { style: { background: colors.bg, minHeight: "100vh", padding: "28px 24px 60px", fontFamily: FONT_BODY, color: colors.hi } },

      h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14, flexWrap: "wrap", gap: 10 } },
        h("div", null,
          h("div", { style: { fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 22, letterSpacing: "-0.01em" } }, "WIP Accrual — Month to Goal"),
          h("div", { style: { fontFamily: FONT_MONO, fontSize: 11.5, color: colors.faint, marginTop: 3 } },
            `SOURCE: CONNECTWISE — BILLABLE TIME ENTRIES` +
            (lastFetched ? ` · refreshed ${lastFetched.toLocaleTimeString()}` : "")
          )
        ),
        monthData.flagged && monthData.flagged.length > 0 && h("div", {
          style: { display: "flex", alignItems: "center", gap: 6, padding: "5px 10px", borderRadius: 6, background: "#2A1414", border: `1px solid ${colors.behind}`, fontFamily: FONT_MONO, fontSize: 10.5, color: colors.behind }
        }, `${monthData.flagged.length} entries need rate review`),
        h("div", { style: { display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 4 } },
          h("button", {
            onClick: handleUpdateClick,
            disabled: updateState === "triggering" || updateState === "waiting",
            style: {
              display: "flex", alignItems: "center", gap: 6, padding: "6px 14px", borderRadius: 6,
              background: colors.finance, color: colors.bg, border: "none", fontFamily: FONT_MONO,
              fontSize: 11.5, fontWeight: 600, cursor: (updateState === "triggering" || updateState === "waiting") ? "default" : "pointer",
              opacity: (updateState === "triggering" || updateState === "waiting") ? 0.6 : 1,
            }
          }, updateState === "triggering" ? "Triggering…" : updateState === "waiting" ? "Updating…" : "⟳ Update Now"),
          updateMessage && h("div", { style: { fontFamily: FONT_MONO, fontSize: 10, color: updateState === "error" ? colors.behind : colors.muted, maxWidth: 220, textAlign: "right" } }, updateMessage)
        )
      ),

      // Month navigator
      h("div", { style: { display: "flex", alignItems: "center", gap: 10, marginBottom: 18 } },
        h(NavArrow, { direction: "prev", disabled: !canPrevMonth, onClick: () => canPrevMonth && setSelectedMonth(manifest.months[monthIdx - 1]) }),
        h("div", { style: { fontFamily: FONT_DISPLAY, fontSize: 15, fontWeight: 600, minWidth: 160, textAlign: "center" } }, fmtMonthLabel(monthData.month)),
        h(NavArrow, { direction: "next", disabled: !canNextMonth, onClick: () => canNextMonth && setSelectedMonth(manifest.months[monthIdx + 1]) }),
        !monthData.isCurrentMonth && h("span", { style: { fontFamily: FONT_MONO, fontSize: 10.5, color: colors.faint, marginLeft: 6 } }, "(closed month)")
      ),

      h("div", { className: "grid-4", style: { marginBottom: 22 } },
        h(StatTile, { label: "MTD Accrued", value: fmtCurrency(mtdTotal), sub: `of ${fmtCurrency(monthData.monthGoal)} goal`, accent: colors.finance, glyph: "●" }),
        h(StatTile, { label: "Pace vs Goal", value: `${onPace ? "+" : ""}${fmtCurrency(paceDelta)}`, sub: onPace ? "ahead of pace" : "behind pace", trendUp: onPace, accent: onPace ? colors.finance : colors.behind, glyph: "◆" }),
        h(StatTile, { label: monthData.isCurrentMonth ? "Projected Month-End" : "Final Total", value: fmtCurrency(monthData.isCurrentMonth ? projectedTotal : mtdTotal), sub: (monthData.isCurrentMonth ? projectedTotal : mtdTotal) >= monthData.monthGoal ? "hit goal" : "missed goal", accent: colors.goalLine, glyph: "■" }),
        h(StatTile, { label: "Weekdays Remaining", value: monthData.weekdaysRemaining, sub: monthData.weekdaysRemaining > 0 ? `${fmtCurrency((monthData.monthGoal - mtdTotal) / monthData.weekdaysRemaining)}/day needed` : "month closed", accent: colors.bar, glyph: "▲" })
      ),

      h("div", { className: "chart-row", style: { marginBottom: 22 } },
        h(Panel, null,
          h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, flexWrap: "wrap", gap: 10 } },
            h(SectionLabel, { accent: colors.finance }, "Cumulative accrual vs. goal pace"),
            h("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
              h("div", { style: { display: "flex", border: `1px solid ${colors.hairline}`, borderRadius: 6, overflow: "hidden" } },
                h("button", {
                  className: "toggle-btn",
                  onClick: () => setViewMode("month"),
                  style: { padding: "5px 12px", fontFamily: FONT_MONO, fontSize: 11, border: "none", background: viewMode === "month" ? colors.hi : "transparent", color: viewMode === "month" ? colors.bg : colors.muted }
                }, "MONTH"),
                h("button", {
                  className: "toggle-btn",
                  onClick: () => setViewMode("week"),
                  style: { padding: "5px 12px", fontFamily: FONT_MONO, fontSize: 11, border: "none", background: viewMode === "week" ? colors.hi : "transparent", color: viewMode === "week" ? colors.bg : colors.muted }
                }, "WEEK")
              ),
              viewMode === "week" && h("div", { style: { display: "flex", alignItems: "center", gap: 8 } },
                h(NavArrow, { direction: "prev", disabled: !canPrevWeek, onClick: () => canPrevWeek && setWeekIndex(effectiveWeekIndex - 1) }),
                h("span", { style: { fontFamily: FONT_MONO, fontSize: 11, color: colors.muted, minWidth: 90, textAlign: "center" } },
                  weeks[effectiveWeekIndex] && weeks[effectiveWeekIndex].length
                    ? `${fmtMD(weeks[effectiveWeekIndex][0])}–${fmtMD(weeks[effectiveWeekIndex][weeks[effectiveWeekIndex].length - 1])}`
                    : ""
                ),
                h(NavArrow, { direction: "next", disabled: !canNextWeek, onClick: () => canNextWeek && setWeekIndex(effectiveWeekIndex + 1) })
              )
            )
          ),
          h(AccrualChart, {
            data: chartData,
            selectedDate: selectedDay,
            onDayClick: (date) => setSelectedDay((prev) => (prev === date ? null : date)),
          }),
          h("div", { style: { display: "flex", gap: 18, marginTop: 8, fontSize: 12, color: colors.muted } },
            h("div", { style: { display: "flex", alignItems: "center", gap: 6 } }, h("div", { style: { width: 14, height: 2, background: colors.finance } }), "cumulative accrued"),
            h("div", { style: { display: "flex", alignItems: "center", gap: 6 } }, h("div", { style: { width: 14, height: 2, borderTop: `2px dashed ${colors.goalLine}` } }), "goal pace (weekdays only)"),
            h("div", { style: { display: "flex", alignItems: "center", gap: 6 } }, h("div", { style: { width: 8, height: 8, background: colors.bar, opacity: 0.55 } }), "daily")
          ),
          h("div", { style: { marginTop: 6, fontSize: 10.5, fontFamily: FONT_MONO, color: colors.faint } }, "Hover a day for values · click a day for client detail")
        ),
        h("div", { className: "side-metrics" },
          h(StatTile, {
            label: "Avg Hourly Rate",
            value: totalBilledHours > 0 ? `${fmtCurrency(avgHourlyRate)}/hr` : "—",
            sub: `${totalBilledHours.toFixed(2)} billed hrs this month`,
            accent: colors.finance,
            glyph: "$"
          }),
          h(StatTile, {
            label: monthData.isCurrentMonth ? "Today vs Daily Goal" : "Last Day vs Daily Goal",
            value: `${todayDelta >= 0 ? "+" : "-"}${fmtCurrency(todayDelta)}`,
            sub: todayDelta >= 0
              ? `${fmtCurrency(todayAccrued)} billed — over today's goal`
              : `${fmtCurrency(todayAccrued)} billed — more needed today`,
            trendUp: todayDelta >= 0,
            accent: todayDelta >= 0 ? colors.finance : colors.behind,
            glyph: "→"
          }),
          h(StatTile, {
            label: "Weekdays Ahead/Behind",
            value: `${weekdaysAheadBehind >= 0 ? "+" : ""}${weekdaysAheadBehind.toFixed(1)}`,
            sub: weekdaysAheadBehind >= 0 ? "weekdays ahead of pace" : "weekdays behind pace",
            trendUp: weekdaysAheadBehind >= 0,
            accent: weekdaysAheadBehind >= 0 ? colors.finance : colors.behind,
            glyph: "◆"
          })
        )
      ),

      selectedDay && h(Panel, { style: { marginBottom: 22 } },
        h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 } },
          h(SectionLabel, { accent: colors.bar }, `Billing by client — ${fmtMD(selectedDay)}`),
          h("button", {
            onClick: () => setSelectedDay(null),
            style: { background: "transparent", border: `1px solid ${colors.hairline}`, borderRadius: 6, color: colors.muted, fontFamily: FONT_MONO, fontSize: 11, padding: "4px 10px", cursor: "pointer" }
          }, "Close")
        ),
        dayBreakdown.length === 0
          ? h("div", { style: { fontFamily: FONT_MONO, fontSize: 12, color: colors.faint, padding: "8px 0" } }, "No billed activity this day.")
          : h("div", null,
              h("div", { style: { display: "grid", gridTemplateColumns: "2fr 1fr 1fr", gap: 8, padding: "0 4px 10px", borderBottom: `1px solid ${colors.hairline}`, marginBottom: 6 } },
                ["Client", "Hours", "Billed"].map((label, i) =>
                  h("div", { key: i, style: { fontFamily: FONT_MONO, fontSize: 10.5, color: colors.faint, textTransform: "uppercase", letterSpacing: "0.08em" } }, label)
                )
              ),
              dayBreakdown.map((r, i) =>
                h("div", { key: i, className: "row-hover", style: { display: "grid", gridTemplateColumns: "2fr 1fr 1fr", gap: 8, padding: "10px 4px", alignItems: "center", borderRadius: 6, fontSize: 14 } },
                  h("div", { style: { color: colors.hi } }, r.client),
                  h("div", { style: { fontFamily: FONT_MONO, color: colors.muted } }, r.hours.toFixed(2)),
                  h("div", { style: { fontFamily: FONT_MONO, color: colors.finance } }, fmtCurrency(r.billed))
                )
              ),
              h("div", { style: { display: "grid", gridTemplateColumns: "2fr 1fr 1fr", gap: 8, padding: "10px 4px 0", marginTop: 4, borderTop: `1px solid ${colors.hairline}`, fontSize: 14, fontWeight: 600 } },
                h("div", { style: { color: colors.hi } }, "Total"),
                h("div", { style: { fontFamily: FONT_MONO, color: colors.hi } }, dayBreakdown.reduce((s, r) => s + r.hours, 0).toFixed(2)),
                h("div", { style: { fontFamily: FONT_MONO, color: colors.finance } }, fmtCurrency(dayBreakdown.reduce((s, r) => s + r.billed, 0)))
              )
            )
      ),
      h(Panel, null,
        h("div", { style: { display: "grid", gridTemplateColumns: "2fr 1fr 1fr", gap: 8, padding: "0 4px 10px", borderBottom: `1px solid ${colors.hairline}`, marginBottom: 6 } },
          ["Client", "MTD Value", "% of Goal"].map((label, i) =>

                      h("div", { style: { color: colors.hi, fontFamily: FONT_MONO } }, "Total"),
                      h("div", { style: { fontFamily: FONT_MONO, color: colors.hi } }, c.daily.reduce((s, d) => s + d.hours, 0).toFixed(2)),

  // ---------- MRR Tab ----------
  const MRR_MANIFEST_URL = `${BASE_URL}/data/mrr/manifest.json`;
  const mrrMonthUrl = (key) => `${BASE_URL}/data/mrr/history/${key}.json`;

  function ProportionBar({ segments }) {
    // segments: [{ label, value, color }]
    const total = segments.reduce((s, seg) => s + seg.value, 0) || 1;
    return h("div", null,
      h("div", { style: { display: "flex", width: "100%", height: 14, borderRadius: 7, overflow: "hidden", background: colors.hairline } },
        segments.map((seg, i) => h("div", {
          key: i,
          style: { width: `${(seg.value / total) * 100}%`, background: seg.color }
        }))
      ),
      h("div", { style: { display: "flex", gap: 18, marginTop: 10, flexWrap: "wrap" } },
        segments.map((seg, i) => h("div", { key: i, style: { display: "flex", alignItems: "center", gap: 6, fontSize: 12.5 } },
          h("div", { style: { width: 9, height: 9, borderRadius: "50%", background: seg.color } }),
          h("span", { style: { color: colors.muted } }, seg.label),
          h("span", { style: { fontFamily: FONT_MONO, color: colors.hi } }, fmtCurrency(seg.value)),
          h("span", { style: { fontFamily: FONT_MONO, color: colors.faint, fontSize: 11 } }, `(${((seg.value / total) * 100).toFixed(0)}%)`)
        ))
      )
    );
  }

  // Stacked bar chart, one bar per month (Licensing + Managed stacked),
  // with hover tooltip and click-to-select — same interaction language
  // as the WIP tab's AccrualChart.
  // Simple least-squares linear regression over (index, value) pairs.
  function linearRegression(values) {
    const n = values.length;
    if (n < 2) return null;
    const xMean = (n - 1) / 2;
    const yMean = values.reduce((s, v) => s + v, 0) / n;
    let num = 0, den = 0;
    for (let i = 0; i < n; i++) {
      num += (i - xMean) * (values[i] - yMean);
      den += (i - xMean) * (i - xMean);
    }
    const slope = den === 0 ? 0 : num / den;
    const intercept = yMean - slope * xMean;
    return { slope, intercept };
  }

  // "2026-08" -> "2026-09"
  function nextMonthKey(key) {
    const [y, m] = key.split("-").map(Number);
    const nm = m === 12 ? 1 : m + 1;
    const ny = m === 12 ? y + 1 : y;
    return `${ny}-${String(nm).padStart(2, "0")}`;
  }

  function MrrTrendChart({ months, selectedMonth, onMonthClick }) {
    const [hoverIdx, setHoverIdx] = useState(null);
    const W = 900, H = 220, padL = 46, padR = 14, padT = 12, padB = 26;
    const innerW = W - padL - padR;
    const innerH = H - padT - padB;

    // Fit a trend line over real months' totals, then project one more
    // month forward as a lightweight forecast — not a real data point,
    // just "if the current trajectory holds."
    const reg = linearRegression(months.map((m) => m.totalMRR));
    const lastReal = months[months.length - 1];
    const recentForRatio = months.slice(-3); // blend last up-to-3 months for the category split
    const licSum = recentForRatio.reduce((s, m) => s + m.licensing, 0);
    const totSum = recentForRatio.reduce((s, m) => s + m.totalMRR, 0);
    const licRatio = totSum > 0 ? licSum / totSum : 0.5;

    let forecast = null;
    if (reg && lastReal) {
      const forecastVal = Math.max(0, reg.slope * months.length + reg.intercept);
      forecast = {
        month: nextMonthKey(lastReal.month),
        totalMRR: Math.round(forecastVal),
        licensing: Math.round(forecastVal * licRatio),
        managed: Math.round(forecastVal * (1 - licRatio)),
        isForecast: true,
      };
    }

    const allSlots = forecast ? [...months, forecast] : months;
    const maxVal = Math.max(1, ...allSlots.map((m) => m.totalMRR));
    const step = allSlots.length > 1 ? innerW / allSlots.length : innerW;
    const barWidth = Math.min(48, step * 0.55);

    const xAt = (i) => padL + i * step + step / 2;
    const yAt = (v) => padT + innerH - (v / maxVal) * innerH;
    const gridLines = 4;
    const gridVals = Array.from({ length: gridLines + 1 }, (_, i) => (maxVal / gridLines) * i);

    // Trend line path, drawn across real months only (not into the forecast slot,
    // since the forecast bar already IS the trend projection).
    const trendPath = reg
      ? months.map((_, i) => `${i === 0 ? "M" : "L"} ${xAt(i)} ${yAt(Math.max(0, reg.slope * i + reg.intercept))}`).join(" ")
      : null;

    const hovered = hoverIdx !== null ? allSlots[hoverIdx] : null;
    let tooltip = null;
    if (hovered) {
      const boxW = 160, boxH = hovered.isForecast ? 82 : 68, gap = 10;
      const px = xAt(hoverIdx);
      let bx = px + gap;
      if (bx + boxW > W - padR) bx = px - gap - boxW;
      let by = yAt(hovered.totalMRR) - boxH - gap;
      if (by < padT) by = padT + gap;

      tooltip = h("g", { style: { pointerEvents: "none" } },
        h("rect", { x: bx, y: by, width: boxW, height: boxH, rx: 6, fill: colors.panel, stroke: colors.hairline, strokeWidth: "1" }),
        h("text", { x: bx + 10, y: by + 18, fontFamily: FONT_MONO, fontSize: "11", fontWeight: "600", fill: colors.hi }, fmtMonthLabel(hovered.month) + (hovered.isForecast ? " (est.)" : "")),
        h("text", { x: bx + 10, y: by + 33, fontFamily: FONT_MONO, fontSize: "10", fill: colors.hi }, `Total: ${fmtCurrency(hovered.totalMRR)}`),
        h("text", { x: bx + 10, y: by + 47, fontFamily: FONT_MONO, fontSize: "10", fill: colors.bar }, `Licensing: ${fmtCurrency(hovered.licensing)}`),
        h("text", { x: bx + 10, y: by + 61, fontFamily: FONT_MONO, fontSize: "10", fill: colors.goalLine }, `Managed: ${fmtCurrency(hovered.managed)}`),
        hovered.isForecast && h("text", { x: bx + 10, y: by + 75, fontFamily: FONT_MONO, fontSize: "9", fill: colors.faint }, "linear trend projection")
      );
    }

    return h("svg", { viewBox: `0 0 ${W} ${H}`, style: { width: "100%", height: "auto", display: "block" } },
      gridVals.map((v, i) => h("g", { key: "grid" + i },
        h("line", { x1: padL, x2: W - padR, y1: yAt(v), y2: yAt(v), stroke: colors.hairline, strokeWidth: "1" }),
        h("text", { x: padL - 8, y: yAt(v) + 4, textAnchor: "end", fontFamily: FONT_MONO, fontSize: "10", fill: colors.faint }, Math.round(v / 1000) + "k")
      )),
      allSlots.map((m, i) => {
        const licH = Math.max(0, yAt(0) - yAt(m.licensing));
        const manH = Math.max(0, yAt(m.licensing) - yAt(m.totalMRR));
        const isSelected = m.month === selectedMonth;
        const opacity = m.isForecast ? 0.28 : (isSelected ? 0.9 : 0.55);
        return h("g", { key: "bar" + i },
          h("rect", { x: xAt(i) - barWidth / 2, y: yAt(m.licensing), width: barWidth, height: licH, fill: colors.bar, opacity, rx: 2, stroke: m.isForecast ? colors.bar : "none", strokeWidth: m.isForecast ? 1 : 0, strokeDasharray: m.isForecast ? "3 2" : "none" }),
          h("rect", { x: xAt(i) - barWidth / 2, y: yAt(m.totalMRR), width: barWidth, height: manH, fill: colors.goalLine, opacity, rx: 2, stroke: m.isForecast ? colors.goalLine : "none", strokeWidth: m.isForecast ? 1 : 0, strokeDasharray: m.isForecast ? "3 2" : "none" }),
          isSelected && !m.isForecast && h("rect", { x: xAt(i) - barWidth / 2 - 2, y: yAt(m.totalMRR) - 2, width: barWidth + 4, height: licH + manH + 4, fill: "none", stroke: colors.hi, strokeWidth: 1.5, rx: 3 })
        );
      }),
      trendPath && h("path", { d: trendPath, fill: "none", stroke: colors.hi, strokeWidth: "1.5", strokeDasharray: "2 3", opacity: 0.55 }),
      allSlots.map((m, i) => h("text", {
        key: "lbl" + i, x: xAt(i), y: H - 6, textAnchor: "middle", fontFamily: FONT_MONO, fontSize: "10",
        fill: m.isForecast ? colors.faint : (m.month === selectedMonth ? colors.hi : colors.faint)
      }, fmtMonthLabel(m.month).split(" ")[0].slice(0, 3) + (m.isForecast ? "*" : ""))),
      allSlots.map((m, i) => h("rect", {
        key: "hit" + i, x: xAt(i) - step / 2, y: padT, width: step, height: innerH, fill: "transparent",
        style: { cursor: m.isForecast ? "default" : "pointer" },
        onMouseEnter: () => setHoverIdx(i),
        onMouseLeave: () => setHoverIdx((prev) => (prev === i ? null : prev)),
        onClick: () => !m.isForecast && onMonthClick && onMonthClick(m.month),
      })),
      tooltip
    );
  }

  function MrrTab() {
    const [monthsMap, setMonthsMap] = useState(null); // { "2026-08": snapshotData, ... }
    const [manifest, setManifest] = useState(null);
    const [selectedMonth, setSelectedMonth] = useState(null);
    const [error, setError] = useState(null);
    const [expandedClient, setExpandedClient] = useState(null);
    const [updateState, setUpdateState] = useState("idle");
    const [updateMessage, setUpdateMessage] = useState("");

    async function loadAll() {
      try {
        const manifestRes = await fetch(`${MRR_MANIFEST_URL}?t=${Date.now()}`);
        if (!manifestRes.ok) throw new Error(`HTTP ${manifestRes.status}`);
        const manifestJson = await manifestRes.json();
        setManifest(manifestJson);

        const entries = await Promise.all(
          manifestJson.months.map(async (key) => {
            const res = await fetch(`${mrrMonthUrl(key)}?t=${Date.now()}`);
            if (!res.ok) throw new Error(`HTTP ${res.status} for ${key}`);
            return [key, await res.json()];
          })
        );
        const map = Object.fromEntries(entries);
        setMonthsMap(map);
        setSelectedMonth((prev) => (prev && map[prev] ? prev : manifestJson.latest));
        setError(null);
        return map[manifestJson.latest];
      } catch (e) {
        setError(e.message);
        return null;
      }
    }

    useEffect(() => { loadAll(); }, []);

    async function handleUpdateClick() {
      setUpdateState("triggering");
      setUpdateMessage("Triggering WIP + MRR pulls…");
      try {
        const res = await fetch(TRIGGER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Trigger-Key": TRIGGER_KEY.trim() },
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok || !body.ok) {
          const detail = body.error || (body.results ? body.results.filter((r) => !r.ok).map((r) => `${r.workflowFile}: ${r.status}`).join(", ") : null);
          throw new Error(detail || `HTTP ${res.status}`);
        }

        setUpdateState("waiting");
        setUpdateMessage("Pulls running — checking for fresh MRR data…");

        const generatedAtBefore = monthsMap && manifest ? monthsMap[manifest.latest]?.generatedAt : null;
        let tries = 0;
        const poll = setInterval(async () => {
          tries += 1;
          const fresh = await loadAll();
          const gotNewData = fresh && fresh.generatedAt !== generatedAtBefore;
          if (gotNewData || tries >= FAST_POLL_MAX_TRIES) {
            clearInterval(poll);
            setUpdateState(gotNewData ? "idle" : "error");
            setUpdateMessage(gotNewData ? "" : "Still processing — check the Actions tab if this takes more than a few minutes.");
          }
        }, FAST_POLL_MS);
      } catch (e) {
        setUpdateState("error");
        setUpdateMessage(`Couldn't trigger update: ${e.message}`);
      }
    }

    if (!monthsMap || !manifest || !selectedMonth) {
      return h("div", { style: { background: colors.bg, minHeight: "60vh", display: "flex", alignItems: "center", justifyContent: "center", color: colors.muted, fontFamily: FONT_MONO } },
        error ? `Error loading MRR data: ${error}` : "Loading MRR data…"
      );
    }

    const data = monthsMap[selectedMonth];
    const licensing = data.byCategory?.["365 Licensing"] || 0;
    const managed = data.byCategory?.["Managed Services"] || 0;

    const trendMonths = manifest.months.map((key) => {
      const m = monthsMap[key];
      // For the current (in-progress) month, chart the projection instead
      // of the partial actual-so-far figure — otherwise the trend line
      // shows a misleading dip at the end purely from billing timing.
      if (m?.isCurrentMonth && m.projected) {
        return {
          month: key,
          totalMRR: m.projected.totalMRR || 0,
          licensing: m.projected.byCategory?.["365 Licensing"] || 0,
          managed: m.projected.byCategory?.["Managed Services"] || 0,
        };
      }
      return {
        month: key,
        totalMRR: m?.totalMRR || 0,
        licensing: m?.byCategory?.["365 Licensing"] || 0,
        managed: m?.byCategory?.["Managed Services"] || 0,
      };
    });

    return h("div", { style: { background: colors.bg, minHeight: "100vh", padding: "28px 24px 60px", fontFamily: FONT_BODY, color: colors.hi } },
      h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14, flexWrap: "wrap", gap: 10 } },
        h("div", null,
          h("div", { style: { fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 22, letterSpacing: "-0.01em" } }, "MRR — Recurring Revenue"),
          h("div", { style: { fontFamily: FONT_MONO, fontSize: 11.5, color: colors.faint, marginTop: 3 } },
            `SOURCE: CONNECTWISE AGREEMENTS · viewing ${fmtMonthLabel(selectedMonth)}${selectedMonth === manifest.latest ? " (latest)" : ""} · snapshot ${new Date(data.generatedAt).toLocaleString()}`
          )
        ),
        h("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
          data.flagged && data.flagged.length > 0 && h("div", {
            style: { display: "flex", alignItems: "center", gap: 6, padding: "5px 10px", borderRadius: 6, background: "#2A1414", border: `1px solid ${colors.behind}`, fontFamily: FONT_MONO, fontSize: 10.5, color: colors.behind }
          }, `${data.flagged.length} items need review`),
          h("div", { style: { display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 4 } },
            h("button", {
              onClick: handleUpdateClick,
              disabled: updateState === "triggering" || updateState === "waiting",
              style: {
                display: "flex", alignItems: "center", gap: 6, padding: "6px 14px", borderRadius: 6,
                background: colors.finance, color: colors.bg, border: "none", fontFamily: FONT_MONO,
                fontSize: 11.5, fontWeight: 600, cursor: (updateState === "triggering" || updateState === "waiting") ? "default" : "pointer",
                opacity: (updateState === "triggering" || updateState === "waiting") ? 0.6 : 1,
              }
            }, updateState === "triggering" ? "Triggering…" : updateState === "waiting" ? "Updating…" : "⟳ Update Now"),
            updateMessage && h("div", { style: { fontFamily: FONT_MONO, fontSize: 10, color: updateState === "error" ? colors.behind : colors.muted, maxWidth: 220, textAlign: "right" } }, updateMessage)
          )
        )
      ),

      data.isCurrentMonth && h("div", {
        style: {
          display: "flex", gap: 10, alignItems: "flex-start", padding: "10px 14px",
          background: colors.panelAlt || colors.panel, border: `1px solid ${colors.hairline}`, borderRadius: 8,
          fontSize: 12, color: colors.muted, marginBottom: 14
        }
      }, `Total MRR reflects actual invoices billed so far this month (as of ${data.currentDate ? fmtMD(data.currentDate) : "today"}) — billing typically lands in batches around the 1st and 15th, so this climbs through the month. See Projected for an estimate of where it'll land.`),

      h("div", { className: "grid-4", style: { gridTemplateColumns: data.isCurrentMonth ? "repeat(4, 1fr)" : "repeat(3, 1fr)", marginBottom: 22 } },
        h(StatTile, { label: data.isCurrentMonth ? "Actual (MTD)" : "Total MRR", value: fmtCurrency(data.totalMRR), sub: `${data.agreements?.length || 0} invoices this month`, accent: colors.finance, glyph: "●" }),
        h(StatTile, { label: "365 Licensing", value: fmtCurrency(licensing), sub: `${data.totalMRR ? ((licensing / data.totalMRR) * 100).toFixed(0) : 0}% of total MRR`, accent: colors.bar, glyph: "◆" }),
        h(StatTile, { label: "Managed Services", value: fmtCurrency(managed), sub: `${data.totalMRR ? ((managed / data.totalMRR) * 100).toFixed(0) : 0}% of total MRR`, accent: colors.goalLine, glyph: "■" }),
        data.isCurrentMonth && h(StatTile, {
          label: "Projected (Full Month)",
          value: fmtCurrency(data.projected?.totalMRR || 0),
          sub: data.projected?.basis === "actual only — no prior month on file yet" ? "no prior month to project from" : "actual + last month's placeholder",
          accent: colors.goalLine,
          glyph: "◇"
        })
      ),

      h(Panel, { style: { marginBottom: 22 } },
        h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 } },
          h(SectionLabel, { accent: colors.finance }, "MRR by month"),
          trendMonths.length < 2 && h("span", { style: { fontFamily: FONT_MONO, fontSize: 10.5, color: colors.faint } }, "History builds as pulls accumulate")
        ),
        h(MrrTrendChart, { months: trendMonths, selectedMonth, onMonthClick: (m) => setSelectedMonth(m) }),
        h("div", { style: { display: "flex", gap: 18, marginTop: 8, fontSize: 12, color: colors.muted } },
          h("div", { style: { display: "flex", alignItems: "center", gap: 6 } }, h("div", { style: { width: 10, height: 10, background: colors.bar, opacity: 0.7 } }), "365 Licensing"),
          h("div", { style: { display: "flex", alignItems: "center", gap: 6 } }, h("div", { style: { width: 10, height: 10, background: colors.goalLine, opacity: 0.7 } }), "Managed Services")
        ),
        h("div", { style: { marginTop: 6, fontSize: 10.5, fontFamily: FONT_MONO, color: colors.faint } }, "Hover a month for values · click a month for detail below · dashed = trend line · faint bar (*) = next month, projected from trend")
      ),

      h(Panel, { style: { marginBottom: 22 } },
        h(SectionLabel, { accent: colors.finance }, "Licensing vs. Managed Services"),
        h(ProportionBar, { segments: [
          { label: "365 Licensing", value: licensing, color: colors.bar },
          { label: "Managed Services", value: managed, color: colors.goalLine },
        ] })
      ),

      h(SectionLabel, { accent: colors.bar }, `MRR by client — ${fmtMonthLabel(selectedMonth)}`),
      h(Panel, null,
        h("div", { style: { display: "grid", gridTemplateColumns: "2fr 1fr 1fr 1fr", gap: 8, padding: "0 4px 10px", borderBottom: `1px solid ${colors.hairline}`, marginBottom: 6 } },
          ["Client", "Licensing", "Managed Svcs", "Total"].map((label, i) =>
            h("div", { key: i, style: { fontFamily: FONT_MONO, fontSize: 10.5, color: colors.faint, textTransform: "uppercase", letterSpacing: "0.08em" } }, label)
          )
        ),
        (data.byClient || []).map((c, i) => {
          const isOpen = expandedClient === c.client;
          const clientAgreements = (data.agreements || []).filter((a) => a.company === c.client);
          return h("div", { key: i },
            h("div", {
              className: "row-hover",
              onClick: () => setExpandedClient(isOpen ? null : c.client),
              style: { display: "grid", gridTemplateColumns: "2fr 1fr 1fr 1fr", gap: 8, padding: "10px 4px", alignItems: "center", borderRadius: 6, fontSize: 14, cursor: "pointer" }
            },
              h("div", { style: { color: colors.hi, display: "flex", alignItems: "center", gap: 6 } },
                h("span", { style: { fontSize: 10, color: colors.faint, transform: isOpen ? "rotate(90deg)" : "rotate(0deg)", transition: "transform 0.15s", display: "inline-block" } }, "›"),
                c.client
              ),
              h("div", { style: { fontFamily: FONT_MONO, color: colors.muted } }, fmtCurrency(c.licensingMRR)),
              h("div", { style: { fontFamily: FONT_MONO, color: colors.muted } }, fmtCurrency(c.managedServicesMRR)),
              h("div", { style: { fontFamily: FONT_MONO, color: colors.finance } }, fmtCurrency(c.totalMRR))
            ),
            isOpen && h("div", { style: { padding: "4px 4px 16px 24px" } },
              clientAgreements.length === 0
                ? h("div", { style: { fontFamily: FONT_MONO, fontSize: 11.5, color: colors.faint } }, "No agreement detail available.")
                : clientAgreements.map((a, ai) => h("div", { key: ai, style: { marginBottom: 14 } },
                    h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 4 } },
                      h("div", { style: { fontSize: 12.5, color: colors.hi } }, `${a.name} `, h("span", { style: { color: colors.faint, fontFamily: FONT_MONO, fontSize: 10.5 } }, `(${a.type || "—"} · ${a.billingCycle || "—"})`)),
                      h("div", { style: { fontFamily: FONT_MONO, fontSize: 12.5, color: colors.finance } }, fmtCurrency(a.agreementMonthlyTotal))
                    ),
                    a.monthlyBillAmount > 0 && h("div", { style: { display: "grid", gridTemplateColumns: "2fr 1fr 1fr", gap: 8, padding: "4px 4px", fontSize: 12, color: colors.muted } },
                      h("div", null, "Agreement block fee"),
                      h("div", null, "—"),
                      h("div", { style: { fontFamily: FONT_MONO } }, fmtCurrency(a.monthlyBillAmount))
                    ),
                    (a.additions || []).map((add, addi) => h("div", { key: addi, style: { display: "grid", gridTemplateColumns: "2fr 1fr 1fr", gap: 8, padding: "4px 4px", fontSize: 12, color: colors.muted } },
                      h("div", null, add.description),
                      h("div", { style: { color: add.category === "365 Licensing" ? colors.bar : colors.goalLine, fontFamily: FONT_MONO, fontSize: 10.5 } }, add.category === "365 Licensing" ? "Licensing" : "Managed"),
                      h("div", { style: { fontFamily: FONT_MONO } }, fmtCurrency(add.monthlyAmount))
                    ))
                  ))
            )
          );
        })
      )
    );
  }


  // ---------- Sales Tab (placeholder) ----------
  function SalesTab() {
    return h("div", { style: { background: colors.bg, minHeight: "60vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 8, color: colors.muted, fontFamily: FONT_BODY } },
      h("div", { style: { fontFamily: FONT_DISPLAY, fontSize: 18, color: colors.hi } }, "Sales — coming soon"),
      h("div", { style: { fontSize: 13, textAlign: "center", maxWidth: 340 } }, "Hardware, licensing renewals, and one-off product sales, pulled from ConnectWise invoice Product line items.")
    );
  }

  // ---------- Tab bar + App shell ----------
  const TABS = [
    { key: "wip", label: "WIP" },
    { key: "mrr", label: "MRR" },
    { key: "sales", label: "Sales", disabled: true },
  ];

  function TabBar({ active, onChange }) {
    return h("div", { className: "tab-bar" },
      TABS.map((t) => h("button", {
        key: t.key,
        className: "tab-btn",
        disabled: t.disabled,
        onClick: () => !t.disabled && onChange(t.key),
        style: {
          background: "transparent", border: "none",
          borderBottom: active === t.key ? `2px solid ${colors.finance}` : "2px solid transparent",
          color: active === t.key ? colors.hi : colors.muted,
          fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 13,
          padding: "8px 14px",
        }
      }, t.label + (t.disabled ? " (soon)" : "")))
    );
  }

  function App() {
    const validTabs = TABS.map((t) => t.key);
    const initial = validTabs.includes(window.location.hash.replace("#", "")) ? window.location.hash.replace("#", "") : "wip";
    const [tab, setTab] = useState(initial);

    function changeTab(key) {
      setTab(key);
      window.location.hash = key;
    }

    return h("div", { style: { background: colors.bg, minHeight: "100vh" } },
      h("div", { className: "masthead" },
        h("div", { className: "masthead-logo-chip" },
          h("img", { src: LOGO_DATA_URI, alt: "Banks Technology Services", style: { height: 26, display: "block" } })
        ),
        h("div", { style: { fontFamily: FONT_MONO, fontSize: 11, color: colors.faint, letterSpacing: "0.08em", textTransform: "uppercase" } }, "Command Deck")
      ),
      h(TabBar, { active: tab, onChange: changeTab }),
      tab === "wip" && h(WipTab),
      tab === "mrr" && h(MrrTab),
      tab === "sales" && h(SalesTab)
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>
