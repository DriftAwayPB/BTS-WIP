<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WIP Accrual — Banks Technology Services</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0B1120; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 900px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } }
  .row-hover:hover { background: #16203570 !important; }
  .nav-btn { cursor: pointer; user-select: none; }
  .nav-btn:hover { opacity: 0.7; }
  .nav-btn[disabled] { opacity: 0.25; cursor: default; }
  .toggle-btn { cursor: pointer; }
</style>
</head>
<body>
<div id="root"></div>
<div id="fallback-error" style="display:none; color:#F87171; font-family: monospace; padding: 24px; white-space: pre-wrap;"></div>

<script>
  window.addEventListener("error", function (e) {
    var el = document.getElementById("fallback-error");
    if (el) {
      el.style.display = "block";
      el.textContent = "Dashboard failed to load:\n" + (e.error ? (e.error.stack || e.error.message) : e.message);
    }
  });
</script>

<script>
(function () {
  const h = React.createElement;
  const { useState, useEffect, useMemo } = React;

  // ---------- CONFIG ----------
  const BASE_URL = "https://raw.githubusercontent.com/DriftAwayPB/BTS-WIP/refs/heads/main";
  const MANIFEST_URL = `${BASE_URL}/data/manifest.json`;
  const monthDataUrl = (key) => `${BASE_URL}/data/${key}.json`;
  const REFRESH_INTERVAL_MS = 5 * 60 * 1000;
  const RELOAD_INTERVAL_MS = 60 * 60 * 1000;

  const TRIGGER_URL = "https://wip-dashbaord-trigger.pbanks.workers.dev/";
  const TRIGGER_KEY = "B@nksT3ch"; // <-- fill this in with the TRIGGER_SECRET you set in Cloudflare
  const FAST_POLL_MS = 10 * 1000;
  const FAST_POLL_MAX_TRIES = 12; // ~2 minutes of fast polling after a manual trigger

  // ---------- Design tokens ----------
  const FONT_DISPLAY = "'Space Grotesk', 'Inter', sans-serif";
  const FONT_BODY = "'Inter', sans-serif";
  const FONT_MONO = "'IBM Plex Mono', monospace";

  const colors = {
    bg: "#0B1120", panel: "#121A2B", hairline: "#1E293B",
    hi: "#E7ECF5", muted: "#7C8AA5", faint: "#4B5875",
    finance: "#34D399", behind: "#F87171", goalLine: "#FBBF24", bar: "#60A5FA",
  };

  function fmtCurrency(n) {
    return "$" + Math.abs(Math.round(n || 0)).toLocaleString("en-US");
  }

  // "2026-08-03" -> "8/3"
  function fmtMD(isoDateStr) {
    const [, m, d] = isoDateStr.split("-");
    return `${Number(m)}/${Number(d)}`;
  }

  function isWeekdayISO(isoDateStr) {
    const day = new Date(isoDateStr + "T00:00:00Z").getUTCDay();
    return day !== 0 && day !== 6;
  }

  const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  function fmtMonthLabel(key) {
    const [y, m] = key.split("-").map(Number);
    return `${MONTH_NAMES[m - 1]} ${y}`;
  }

  // All weekday (Mon-Fri) ISO dates within a month, given its key "YYYY-MM"
  function weekdaysInMonthList(monthKey) {
    const [y, m] = monthKey.split("-").map(Number);
    const start = new Date(Date.UTC(y, m - 1, 1));
    const end = new Date(Date.UTC(y, m, 0));
    const out = [];
    const cursor = new Date(start);
    while (cursor <= end) {
      if (!isWeekdayISO(cursor.toISOString().split("T")[0])) {
        // skip weekends
      } else {
        out.push(cursor.toISOString().split("T")[0]);
      }
      cursor.setUTCDate(cursor.getUTCDate() + 1);
    }
    return out;
  }

  // Chunk weekdays into groups of 5 (Mon-Fri "weeks")
  function chunkIntoWeeks(weekdayList) {
    const weeks = [];
    for (let i = 0; i < weekdayList.length; i += 5) {
      weeks.push(weekdayList.slice(i, i + 5));
    }
    return weeks;
  }

  function SectionLabel({ children, accent }) {
    return h("div", { style: { display: "flex", alignItems: "center", gap: 10, marginBottom: 14 } },
      h("div", { style: { width: 6, height: 6, borderRadius: 2, background: accent } }),
      h("span", { style: { fontFamily: FONT_MONO, fontSize: 11, letterSpacing: "0.14em", color: colors.muted, textTransform: "uppercase" } }, children)
    );
  }

  function Panel({ children, style }) {
    return h("div", { style: { background: colors.panel, border: `1px solid ${colors.hairline}`, borderRadius: 10, padding: 18, ...style } }, children);
  }

  function StatTile({ label, value, sub, accent, glyph, trendUp }) {
    return h(Panel, { style: { display: "flex", flexDirection: "column", gap: 10, minHeight: 108 } },
      h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "flex-start" } },
        h("span", { style: { fontFamily: FONT_BODY, fontSize: 12.5, color: colors.muted } }, label),
        h("span", { style: { fontSize: 15, color: accent } }, glyph)
      ),
      h("div", { style: { fontFamily: FONT_MONO, fontSize: 26, color: colors.hi, fontWeight: 600, lineHeight: 1 } }, value),
      sub && h("div", { style: { fontSize: 12, color: colors.muted, fontFamily: FONT_BODY } },
        (trendUp === true ? "▲ " : trendUp === false ? "▼ " : "") + sub
      )
    );
  }

  function NavArrow({ direction, disabled, onClick }) {
    return h("button", {
      className: "nav-btn",
      disabled,
      onClick,
      style: {
        background: "transparent", border: `1px solid ${colors.hairline}`, borderRadius: 6,
        color: colors.hi, width: 28, height: 28, fontFamily: FONT_MONO, fontSize: 14,
      }
    }, direction === "prev" ? "‹" : "›");
  }

  function AccrualChart({ data }) {
    const W = 900, H = 260, padL = 46, padR = 14, padT = 12, padB = 26;
    const innerW = W - padL - padR;
    const innerH = H - padT - padB;

    const maxVal = Math.max(1, ...data.map(d => Math.max(d.cumulative, d.goalPace)));
    const step = data.length > 1 ? innerW / (data.length - 1) : innerW;
    const barWidth = Math.min(28, (innerW / Math.max(data.length, 1)) * 0.5);

    const xAt = (i) => padL + i * step;
    const yAt = (v) => padT + innerH - (v / maxVal) * innerH;

    const cumulativePath = data.map((d, i) => `${i === 0 ? "M" : "L"} ${xAt(i)} ${yAt(d.cumulative)}`).join(" ");
    const goalPath = data.map((d, i) => `${i === 0 ? "M" : "L"} ${xAt(i)} ${yAt(d.goalPace)}`).join(" ");

    const gridLines = 4;
    const gridVals = Array.from({ length: gridLines + 1 }, (_, i) => (maxVal / gridLines) * i);

    return h("svg", { viewBox: `0 0 ${W} ${H}`, style: { width: "100%", height: "auto", display: "block" } },
      gridVals.map((v, i) => h("g", { key: "grid" + i },
        h("line", { x1: padL, x2: W - padR, y1: yAt(v), y2: yAt(v), stroke: colors.hairline, strokeWidth: "1" }),
        h("text", { x: padL - 8, y: yAt(v) + 4, textAnchor: "end", fontFamily: FONT_MONO, fontSize: "10", fill: colors.faint }, Math.round(v / 1000) + "k")
      )),
      data.map((d, i) => h("rect", {
        key: "bar" + i,
        x: xAt(i) - barWidth / 2,
        y: yAt(d.accrued),
        width: barWidth,
        height: Math.max(0, yAt(0) - yAt(d.accrued)),
        fill: colors.bar,
        opacity: "0.55",
        rx: "2",
      })),
      h("path", { d: goalPath, fill: "none", stroke: colors.goalLine, strokeWidth: "1.5", strokeDasharray: "4 4" }),
      h("path", { d: cumulativePath, fill: "none", stroke: colors.finance, strokeWidth: "2.5" }),
      data.map((d, i) => h("circle", { key: "dot" + i, cx: xAt(i), cy: yAt(d.cumulative), r: "3.5", fill: colors.finance })),
      data.map((d, i) => h("text", { key: "lbl" + i, x: xAt(i), y: H - 6, textAnchor: "middle", fontFamily: FONT_MONO, fontSize: "10", fill: colors.faint }, fmtMD(d.date)))
    );
  }

  function Dashboard() {
    const [manifest, setManifest] = useState(null);
    const [selectedMonth, setSelectedMonth] = useState(null);
    const [monthData, setMonthData] = useState(null);
    const [lastFetched, setLastFetched] = useState(null);
    const [fetchError, setFetchError] = useState(null);
    const [viewMode, setViewMode] = useState("month"); // "month" | "week"
    const [weekIndex, setWeekIndex] = useState(null);
    const [updateState, setUpdateState] = useState("idle"); // "idle" | "triggering" | "waiting" | "error"
    const [updateMessage, setUpdateMessage] = useState("");

    async function loadManifest() {
      try {
        const res = await fetch(`${MANIFEST_URL}?t=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        setManifest(json);
        setSelectedMonth((prev) => prev ?? json.latest);
      } catch (e) {
        setFetchError(`manifest: ${e.message}`);
      }
    }

    async function loadMonth(key) {
      try {
        const res = await fetch(`${monthDataUrl(key)}?t=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        setMonthData(json);
        setLastFetched(new Date());
        setFetchError(null);
        return json;
      } catch (e) {
        setFetchError(`${key}: ${e.message}`);
        return null;
      }
    }

    async function handleUpdateClick() {
      setUpdateState("triggering");
      setUpdateMessage("Triggering pull…");
      try {
        const res = await fetch(TRIGGER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Trigger-Key": TRIGGER_KEY },
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok || !body.ok) {
          throw new Error(body.error || `HTTP ${res.status}`);
        }

        setUpdateState("waiting");
        setUpdateMessage("Pull running — checking for fresh data…");

        const generatedAtBefore = monthData ? monthData.generatedAt : null;
        let tries = 0;
        const poll = setInterval(async () => {
          tries += 1;
          const fresh = await loadMonth(selectedMonth);
          const gotNewData = fresh && fresh.generatedAt !== generatedAtBefore;
          if (gotNewData || tries >= FAST_POLL_MAX_TRIES) {
            clearInterval(poll);
            if (gotNewData) {
              setUpdateState("idle");
              setUpdateMessage("");
              loadManifest(); // in case a new month appeared
            } else {
              setUpdateState("error");
              setUpdateMessage("Still processing — check the Actions tab if this takes more than a few minutes.");
            }
          }
        }, FAST_POLL_MS);
      } catch (e) {
        setUpdateState("error");
        setUpdateMessage(`Couldn't trigger update: ${e.message}`);
      }
    }

    useEffect(() => {
      loadManifest();
      const reloadTimer = setInterval(() => window.location.reload(), RELOAD_INTERVAL_MS);
      return () => clearInterval(reloadTimer);
    }, []);

    useEffect(() => {
      if (!selectedMonth) return;
      loadMonth(selectedMonth);
      const dataTimer = setInterval(() => loadMonth(selectedMonth), REFRESH_INTERVAL_MS);
      return () => clearInterval(dataTimer);
    }, [selectedMonth]);

    // Reset to "month" view and current-ish week whenever the month changes
    useEffect(() => {
      setViewMode("month");
      setWeekIndex(null);
    }, [selectedMonth]);

    const weeks = useMemo(() => {
      if (!monthData) return [];
      return chunkIntoWeeks(weekdaysInMonthList(monthData.month));
    }, [monthData]);

    // Default week index: the chunk containing currentDate (current month) or the last chunk (closed months)
    const effectiveWeekIndex = useMemo(() => {
      if (weekIndex !== null) return weekIndex;
      if (!monthData || weeks.length === 0) return 0;
      const idx = weeks.findIndex((wk) => wk.includes(monthData.currentDate));
      return idx >= 0 ? idx : weeks.length - 1;
    }, [weekIndex, weeks, monthData]);

    // Builds a chart series for an arbitrary set of weekday dates, filling
    // in zero-accrual days so bars still appear, with cumulative/goalPace
    // computed fresh from the start of that range.
    const chartData = useMemo(() => {
      if (!monthData) return [];
      const dailyGoalPace = monthData.monthGoal / monthData.weekdaysInMonth;
      const accrualByDate = new Map(monthData.dailyAccrual.map((d) => [d.date, d.accrued]));

      const dates = viewMode === "week" ? (weeks[effectiveWeekIndex] || []) : weekdaysInMonthList(monthData.month);

      let running = 0;
      let weekdayCount = 0;
      // For week view, cumulative should still reflect the month-to-date
      // total carried in from before the visible window, not reset to 0 —
      // otherwise a mid-month week looks like accrual started at zero.
      if (viewMode === "week" && dates.length > 0) {
        const firstVisible = dates[0];
        for (const d of monthData.dailyAccrual) {
          if (d.date < firstVisible) running += d.accrued;
        }
        const priorWeekdays = weekdaysInMonthList(monthData.month).filter((d) => d < firstVisible);
        weekdayCount = priorWeekdays.length;
      }

      return dates.map((date) => {
        const accrued = accrualByDate.get(date) || 0;
        running += accrued;
        if (isWeekdayISO(date)) weekdayCount += 1;
        return { date, accrued, cumulative: running, goalPace: Math.round(dailyGoalPace * weekdayCount) };
      });
    }, [monthData, viewMode, effectiveWeekIndex, weeks]);

    if (!manifest || !monthData) {
      return h("div", { style: { background: colors.bg, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: colors.muted, fontFamily: FONT_MONO } },
        fetchError ? `Error loading data: ${fetchError}` : "Loading WIP data…"
      );
    }

    const mtdTotal = monthData.dailyAccrual.reduce((s, d) => s + d.accrued, 0);
    const dailyGoalPace = monthData.monthGoal / monthData.weekdaysInMonth;
    const expectedByToday = dailyGoalPace * monthData.weekdaysElapsed;
    const paceDelta = mtdTotal - expectedByToday;
    const onPace = paceDelta >= 0;
    const projectedTotal = monthData.weekdaysElapsed > 0 ? (mtdTotal / monthData.weekdaysElapsed) * monthData.weekdaysInMonth : 0;

    const monthIdx = manifest.months.indexOf(selectedMonth);
    const canPrevMonth = monthIdx > 0;
    const canNextMonth = monthIdx >= 0 && monthIdx < manifest.months.length - 1;

    const canPrevWeek = effectiveWeekIndex > 0;
    const canNextWeek = effectiveWeekIndex < weeks.length - 1;

    return h("div", { style: { background: colors.bg, minHeight: "100vh", padding: "28px 24px 60px", fontFamily: FONT_BODY, color: colors.hi } },

      h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14, flexWrap: "wrap", gap: 10 } },
        h("div", null,
          h("div", { style: { fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 22, letterSpacing: "-0.01em" } }, "WIP Accrual — Month to Goal"),
          h("div", { style: { fontFamily: FONT_MONO, fontSize: 11.5, color: colors.faint, marginTop: 3 } },
            `SOURCE: CONNECTWISE — BILLABLE TIME ENTRIES` +
            (lastFetched ? ` · refreshed ${lastFetched.toLocaleTimeString()}` : "")
          )
        ),
        monthData.flagged && monthData.flagged.length > 0 && h("div", {
          style: { display: "flex", alignItems: "center", gap: 6, padding: "5px 10px", borderRadius: 6, background: "#2A1414", border: `1px solid ${colors.behind}`, fontFamily: FONT_MONO, fontSize: 10.5, color: colors.behind }
        }, `${monthData.flagged.length} entries need rate review`),
        h("div", { style: { display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 4 } },
          h("button", {
            onClick: handleUpdateClick,
            disabled: updateState === "triggering" || updateState === "waiting",
            style: {
              display: "flex", alignItems: "center", gap: 6, padding: "6px 14px", borderRadius: 6,
              background: colors.finance, color: colors.bg, border: "none", fontFamily: FONT_MONO,
              fontSize: 11.5, fontWeight: 600, cursor: (updateState === "triggering" || updateState === "waiting") ? "default" : "pointer",
              opacity: (updateState === "triggering" || updateState === "waiting") ? 0.6 : 1,
            }
          }, updateState === "triggering" ? "Triggering…" : updateState === "waiting" ? "Updating…" : "⟳ Update Now"),
          updateMessage && h("div", { style: { fontFamily: FONT_MONO, fontSize: 10, color: updateState === "error" ? colors.behind : colors.muted, maxWidth: 220, textAlign: "right" } }, updateMessage)
        )
      ),

      // Month navigator
      h("div", { style: { display: "flex", alignItems: "center", gap: 10, marginBottom: 18 } },
        h(NavArrow, { direction: "prev", disabled: !canPrevMonth, onClick: () => canPrevMonth && setSelectedMonth(manifest.months[monthIdx - 1]) }),
        h("div", { style: { fontFamily: FONT_DISPLAY, fontSize: 15, fontWeight: 600, minWidth: 160, textAlign: "center" } }, fmtMonthLabel(monthData.month)),
        h(NavArrow, { direction: "next", disabled: !canNextMonth, onClick: () => canNextMonth && setSelectedMonth(manifest.months[monthIdx + 1]) }),
        !monthData.isCurrentMonth && h("span", { style: { fontFamily: FONT_MONO, fontSize: 10.5, color: colors.faint, marginLeft: 6 } }, "(closed month)")
      ),

      h("div", { className: "grid-4", style: { marginBottom: 22 } },
        h(StatTile, { label: "MTD Accrued", value: fmtCurrency(mtdTotal), sub: `of ${fmtCurrency(monthData.monthGoal)} goal`, accent: colors.finance, glyph: "●" }),
        h(StatTile, { label: "Pace vs Goal", value: `${onPace ? "+" : ""}${fmtCurrency(paceDelta)}`, sub: onPace ? "ahead of pace" : "behind pace", trendUp: onPace, accent: onPace ? colors.finance : colors.behind, glyph: "◆" }),
        h(StatTile, { label: monthData.isCurrentMonth ? "Projected Month-End" : "Final Total", value: fmtCurrency(monthData.isCurrentMonth ? projectedTotal : mtdTotal), sub: (monthData.isCurrentMonth ? projectedTotal : mtdTotal) >= monthData.monthGoal ? "hit goal" : "missed goal", accent: colors.goalLine, glyph: "■" }),
        h(StatTile, { label: "Weekdays Remaining", value: monthData.weekdaysRemaining, sub: monthData.weekdaysRemaining > 0 ? `${fmtCurrency((monthData.monthGoal - mtdTotal) / monthData.weekdaysRemaining)}/day needed` : "month closed", accent: colors.bar, glyph: "▲" })
      ),

      h(Panel, { style: { marginBottom: 22 } },
        h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, flexWrap: "wrap", gap: 10 } },
          h(SectionLabel, { accent: colors.finance }, "Cumulative accrual vs. goal pace"),
          h("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
            h("div", { style: { display: "flex", border: `1px solid ${colors.hairline}`, borderRadius: 6, overflow: "hidden" } },
              h("button", {
                className: "toggle-btn",
                onClick: () => setViewMode("month"),
                style: { padding: "5px 12px", fontFamily: FONT_MONO, fontSize: 11, border: "none", background: viewMode === "month" ? colors.hi : "transparent", color: viewMode === "month" ? colors.bg : colors.muted }
              }, "MONTH"),
              h("button", {
                className: "toggle-btn",
                onClick: () => setViewMode("week"),
                style: { padding: "5px 12px", fontFamily: FONT_MONO, fontSize: 11, border: "none", background: viewMode === "week" ? colors.hi : "transparent", color: viewMode === "week" ? colors.bg : colors.muted }
              }, "WEEK")
            ),
            viewMode === "week" && h("div", { style: { display: "flex", alignItems: "center", gap: 8 } },
              h(NavArrow, { direction: "prev", disabled: !canPrevWeek, onClick: () => canPrevWeek && setWeekIndex(effectiveWeekIndex - 1) }),
              h("span", { style: { fontFamily: FONT_MONO, fontSize: 11, color: colors.muted, minWidth: 90, textAlign: "center" } },
                weeks[effectiveWeekIndex] && weeks[effectiveWeekIndex].length
                  ? `${fmtMD(weeks[effectiveWeekIndex][0])}–${fmtMD(weeks[effectiveWeekIndex][weeks[effectiveWeekIndex].length - 1])}`
                  : ""
              ),
              h(NavArrow, { direction: "next", disabled: !canNextWeek, onClick: () => canNextWeek && setWeekIndex(effectiveWeekIndex + 1) })
            )
          )
        ),
        h(AccrualChart, { data: chartData }),
        h("div", { style: { display: "flex", gap: 18, marginTop: 8, fontSize: 12, color: colors.muted } },
          h("div", { style: { display: "flex", alignItems: "center", gap: 6 } }, h("div", { style: { width: 14, height: 2, background: colors.finance } }), "cumulative accrued"),
          h("div", { style: { display: "flex", alignItems: "center", gap: 6 } }, h("div", { style: { width: 14, height: 2, borderTop: `2px dashed ${colors.goalLine}` } }), "goal pace (weekdays only)"),
          h("div", { style: { display: "flex", alignItems: "center", gap: 6 } }, h("div", { style: { width: 8, height: 8, background: colors.bar, opacity: 0.55 } }), "daily")
        )
      ),

      h(SectionLabel, { accent: colors.bar }, "MTD accrual by client"),
      h(Panel, null,
        h("div", { style: { display: "grid", gridTemplateColumns: "2fr 1fr 1fr", gap: 8, padding: "0 4px 10px", borderBottom: `1px solid ${colors.hairline}`, marginBottom: 6 } },
          ["Client", "MTD Value", "% of Goal"].map((label, i) =>
            h("div", { key: i, style: { fontFamily: FONT_MONO, fontSize: 10.5, color: colors.faint, textTransform: "uppercase", letterSpacing: "0.08em" } }, label)
          )
        ),
        monthData.clientBreakdown.slice().sort((a, b) => b.mtd - a.mtd).map((c, i) =>
          h("div", { key: i, className: "row-hover", style: { display: "grid", gridTemplateColumns: "2fr 1fr 1fr", gap: 8, padding: "10px 4px", alignItems: "center", borderRadius: 6, fontSize: 14 } },
            h("div", { style: { color: colors.hi } }, c.client),
            h("div", { style: { fontFamily: FONT_MONO, color: colors.muted } }, fmtCurrency(c.mtd)),
            h("div", { style: { fontFamily: FONT_MONO, color: colors.muted } }, c.pctOfGoal + "%")
          )
        )
      )
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(Dashboard));
})();
</script>
</body>
</html>
